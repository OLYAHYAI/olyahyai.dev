# Build the site (Hugo) + the CV PDFs (headless Chrome) and deploy to Cloudflare Pages.
# - push on main      -> production (olyahyai.dev)
# - push on any other branch -> preview URL <branch>.<project>.pages.dev
# GitHub is a push-mirror of Forgejo: branches/PRs are reviewed on Forgejo, GitHub only builds.
name: build-and-deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.168.0"
  # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb (from the release checksums.txt)
  HUGO_SHA256: "b7cd5087c39bf5584e40180bd04fab0c6fb19f2913cd63121da8663e112a08db"
  CF_PROJECT: "olyahyai-dev"
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the secret scan

      # Pinned binary instead of gitleaks-action: the action scans "<first>^..<last>",
      # which fails on a repository's very first push (the root commit has no parent).
      # Here the whole history is scanned on every run (small repo); findings are redacted.
      - name: Secret scan (gitleaks, full history)
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  ${tgz}" | sha256sum -c -
          tar xzf "${tgz}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Leak check (private IPs, tailnet names, MACs, guest IDs, private denylist)
        env:
          SENSITIVE_DENYLIST: ${{ secrets.SENSITIVE_DENYLIST }}
        run: scripts/check-sensitive.sh

      - name: Install Hugo (pinned + checksum)
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          echo "${HUGO_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"
          hugo version

      - name: Build site
        run: hugo --gc --minify

      - name: Build CV PDFs
        run: scripts/build-pdf.sh "$(command -v google-chrome)"

      - name: Check output
        run: |
          for f in public/index.html public/fr/index.html public/cv/index.html public/fr/cv/index.html public/cv/en.pdf public/cv/fr.pdf; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      # Creates the Pages project on the first run (idempotent: "already exists" is accepted),
      # so nothing has to be clicked in the Cloudflare dashboard besides the API token.
      - name: Ensure Cloudflare Pages project exists
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          code=$(curl -sS -o get.json -w '%{http_code}' -H "Authorization: Bearer ${CF_TOKEN}" "${api}/${CF_PROJECT}")
          if [ "$code" = "200" ]; then echo "project ${CF_PROJECT} exists"; exit 0; fi
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"${CF_PROJECT}\",\"production_branch\":\"main\"}" "${api}")
          echo "create -> HTTP ${code}"
          python3 -c "import json;d=json.load(open('create.json'));print('success:',d.get('success'),'errors:',d.get('errors'))"
          [ "$code" = "200" ]

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true
