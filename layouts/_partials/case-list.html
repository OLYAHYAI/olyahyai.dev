<ul class="cards">
{{- range $i, $p := . }}
  <li class="card">
    <a href="{{ $p.RelPermalink }}">
      <span class="num">{{ printf "%02d" (add $i 1) }}</span>
      <h3>{{ $p.Title }}</h3>
      <p>{{ $p.Summary }}</p>
      {{- with $p.Params.tags }}<p class="tags">{{ range . }}<span>{{ . }}</span>{{ end }}</p>{{ end }}
    </a>
  </li>
{{- end }}
</ul>
