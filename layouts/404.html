{{ define "main" }}
<section class="notfound">
  <p class="prompt">$ curl -I {{ "/" | absLangURL }}…</p>
  <pre class="mono">HTTP/2 404</pre>
  <h1 class="page-title">{{ i18n "notfound_title" }}</h1>
  <p class="lede">{{ i18n "notfound_text" }}</p>
  <nav class="actions">
    <a class="btn btn-primary" href="{{ "/" | relLangURL }}">{{ i18n "home" }}</a>
    {{- with site.GetPage "/case-studies" }}<a class="btn btn-ghost" href="{{ .RelPermalink }}">{{ i18n "case_studies" }}</a>{{ end }}
  </nav>
</section>
{{ end }}
